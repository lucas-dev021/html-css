<!DOCTYPE html>
<html lang="py-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midías em HTML5</title>
</head>
<body>
    <h1>imagens dinamicas</h1>
    <p>tenta ai paizao abrir essas imagens em dispositivos diferentes ou até memso aumenta e dimimnua o tamanho do seu navegador</p>
    <picture>
        <source media="(max-width:700px )" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width: 1000px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem flexivel">

    </picture>
    
    <h1>Reproduzindo Audios</h1>
    <audio src="midia/God Is.mp3" controls autoplay></audio>
    <h1>Outro Audio</h1>
    <audio src="midia/God Is.mp3"type="audio/mpeg">
        <source src="midia/God Is.mp3" type="audio/mpeg">
        <p>infelizmente seu navegador não consegue reprosuzir audio</p>
    </audio>
</body>
</html>
